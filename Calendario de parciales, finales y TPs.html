<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendario de parciales, finales y TPs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef0f8;--surface:#fff;--ink:#12163a;--muted:#596083;--line:#dbe0ef;--accent:#2a37a0;--on-accent:#fff;
  --parcial:#0b6f78;--parcial-bg:#d6f0f2;--final:#b81f55;--final-bg:#fddfe9;--tp:#8a5a00;--tp-bg:#fdecc4;--shadow:rgba(20,24,43,.2);
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1122;--surface:#171b34;--ink:#eceffa;--muted:#9aa2c4;--line:#2a2f50;--accent:#9bacff;--on-accent:#0e1122;
    --parcial:#62d6df;--parcial-bg:#11373c;--final:#ff86ac;--final-bg:#4b1830;--tp:#ffcb66;--tp-bg:#44320f;--shadow:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1122;--surface:#171b34;--ink:#eceffa;--muted:#9aa2c4;--line:#2a2f50;--accent:#9bacff;--on-accent:#0e1122;
  --parcial:#62d6df;--parcial-bg:#11373c;--final:#ff86ac;--final-bg:#4b1830;--tp:#ffcb66;--tp-bg:#44320f;--shadow:rgba(0,0,0,.6);color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);gap:20px;align-items:start}
.rail{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h2{margin:0 0 10px;font:800 1rem/1.2 var(--head)}
.hero{background:var(--accent);color:var(--on-accent);border-radius:20px;padding:20px 22px}
.hero .big{font:800 clamp(4.2rem,12vw,6.4rem)/.9 var(--head);letter-spacing:-.04em}
.hero p{margin:8px 0 0;font-weight:600;font-size:1.05rem}
.hero small{display:block;margin-top:4px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font:800 1.7rem/1.1 var(--head)}
.stats span{font-size:.8rem;color:var(--muted)}
.fils{display:flex;flex-wrap:wrap;gap:6px}
.fil{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.fil[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.util{display:flex;gap:8px;flex-wrap:wrap}
.hint{margin:10px 0 0;font-size:.8rem;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font:800 clamp(2rem,5vw,3rem)/1 var(--head);letter-spacing:-.02em}
.sub{color:var(--muted);font-weight:500;margin-top:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--final)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{padding:10px 6px;text-align:center;font-weight:600;color:var(--muted);font-size:.85rem;border-bottom:1px solid var(--line)}
.cell{min-height:108px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:color-mix(in srgb,var(--bg) 55%,var(--surface))}
.cell.out .num{color:var(--muted);opacity:.6}
.cell:hover{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.num{align-self:flex-start;border:0;background:none;width:28px;height:28px;border-radius:50%;font-weight:600;padding:0}
.cell.today .num{background:var(--accent);color:var(--on-accent)}
.chip{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:3px 6px;font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.parcial,.tag.parcial{background:var(--parcial-bg);color:var(--parcial)}
.chip.final,.tag.final{background:var(--final-bg);color:var(--final)}
.chip.tp,.tag.tp{background:var(--tp-bg);color:var(--tp)}
.chip.done{opacity:.55;text-decoration:line-through}
.dots{display:none;gap:4px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot.parcial{background:var(--parcial)}.dot.final{background:var(--final)}.dot.tp{background:var(--tp)}
.dot.all{background:var(--muted)}
.tabs{display:flex;gap:6px;margin:24px 0 10px}
.tab{border:0;background:none;font:800 1.25rem/1.2 var(--head);color:var(--muted);padding:4px 10px 4px 0}
.tab[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;text-decoration-color:var(--accent)}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:8px 12px 8px 10px}
.row.parcial{border-left-color:var(--parcial)}.row.final{border-left-color:var(--final)}.row.tp{border-left-color:var(--tp)}
.row.done{opacity:.6}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-weight:800;padding:0;line-height:1}
.chk[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.main{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;border:0;background:none;padding:0}
.d{font:800 1.15rem/1.1 var(--head)}
.d span{display:block;font:500 .78rem var(--body);color:var(--muted)}
.m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m span{color:var(--muted);font-size:.9rem}
.urg .m span{color:var(--final);font-weight:600}
.tag{font-size:.78rem;font-weight:600;border-radius:999px;padding:3px 10px}
.empty{color:var(--muted);padding:16px;border:1px dashed var(--line);border-radius:12px}
.overlay{position:fixed;inset:0;background:rgba(10,12,28,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:100%;overflow:auto;box-shadow:0 20px 50px var(--shadow)}
.modal h3{margin:0 0 14px;font:800 1.3rem/1.2 var(--head)}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=date],input[type=time],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{height:150px;font:.8rem/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;border:2px solid var(--line);border-radius:10px;padding:9px;cursor:pointer}
.seg input:checked+label.p{border-color:var(--parcial);background:var(--parcial-bg);color:var(--parcial)}
.seg input:checked+label.f{border-color:var(--final);background:var(--final-bg);color:var(--final)}
.seg input:checked+label.t{border-color:var(--tp);background:var(--tp-bg);color:var(--tp)}
.seg input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.ck2{display:flex;gap:8px;align-items:center;margin-top:14px}
.ck2 input{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.actions .sp{flex:1}
#bkmsg{min-height:1.4em;margin:8px 0 0;font-size:.9rem;color:var(--muted)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .rail{display:contents}
  .hero{order:0}.main-col{order:1}.panel{order:2}
}
@media (max-width:640px){
  .cell{min-height:64px;padding:4px;align-items:center}
  .num{align-self:center}
  .chip{display:none}.dots{display:flex;justify-content:center}
  .main{grid-template-columns:56px minmax(0,1fr)}.main .tag{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="layout">
  <aside class="rail">
    <section class="hero" id="hero" aria-live="polite"></section>
    <section class="panel"><div class="stats" id="stats"></div></section>
    <section class="panel">
      <h2>Mostrar</h2>
      <div class="fils">
        <button class="fil" data-f="all" aria-pressed="true"><i class="dot all"></i>Todo</button>
        <button class="fil" data-f="parcial" aria-pressed="false"><i class="dot parcial"></i>Parciales</button>
        <button class="fil" data-f="final" aria-pressed="false"><i class="dot final"></i>Finales</button>
        <button class="fil" data-f="tp" aria-pressed="false"><i class="dot tp"></i>TPs</button>
      </div>
    </section>
    <section class="panel">
      <div class="util"><button class="btn" id="resp">Respaldo</button><button class="btn" id="tema">Cambiar tema</button></div>
      <p class="hint">Atajos: flechas para cambiar de mes, T para hoy, N para anotar.</p>
    </section>
  </aside>
  <main class="main-col">
    <div class="top">
      <div><h1 id="mes">Mes</h1><div class="sub" id="resumen"></div></div>
      <div class="nav">
        <button class="btn" id="prev" aria-label="Mes anterior">Anterior</button>
        <button class="btn" id="hoy">Hoy</button>
        <button class="btn" id="next" aria-label="Mes siguiente">Siguiente</button>
        <button class="btn primary" id="nuevo">Anotar fecha</button>
      </div>
    </div>
    <div class="cal"><div class="grid" id="grid"></div></div>
    <div class="tabs">
      <button class="tab" data-m="mes" aria-pressed="true">Este mes</button>
      <button class="tab" data-m="prox" aria-pressed="false">Próximas</button>
    </div>
    <div class="list" id="lista"></div>
  </main>
</div></div>

<div class="overlay" id="ov">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">Anotar fecha</h3>
    <div class="seg">
      <input type="radio" name="tipo" id="t1" value="parcial" checked><label class="p" for="t1">Parcial</label>
      <input type="radio" name="tipo" id="t2" value="final"><label class="f" for="t2">Final</label>
      <input type="radio" name="tipo" id="t3" value="tp"><label class="t" for="t3">TP</label>
    </div>
    <label for="materia">Materia</label>
    <input type="text" id="materia" maxlength="60" list="mats" placeholder="Ej: Programación II" autocomplete="off">
    <datalist id="mats"></datalist>
    <div class="two">
      <div><label for="fecha">Fecha</label><input type="date" id="fecha"></div>
      <div><label for="hora">Hora (opcional)</label><input type="time" id="hora"></div>
    </div>
    <label for="nota">Nota (opcional)</label>
    <input type="text" id="nota" maxlength="80" placeholder="Aula, temas, si es grupal…">
    <label class="ck2"><input type="checkbox" id="hecho">Ya lo rendí o entregué</label>
    <div id="califw" hidden><label for="calif">Nota obtenida</label><input type="text" id="calif" maxlength="5" inputmode="decimal" placeholder="Ej: 8"></div>
    <div class="actions">
      <button class="btn danger" id="del" hidden>Eliminar</button>
      <span class="sp"></span>
      <button class="btn" id="cancel">Cancelar</button>
      <button class="btn primary" id="save">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov2">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bt">
    <h3 id="bt">Respaldo de tus fechas</h3>
    <p class="sub">Copiá este texto para guardarlo, o pegá uno de otro dispositivo y tocá Importar. Las fechas se suman, no se pisan.</p>
    <textarea id="bk" aria-label="Texto del respaldo"></textarea>
    <p id="bkmsg" aria-live="polite"></p>
    <div class="actions">
      <button class="btn" id="bkcopy">Copiar</button>
      <button class="btn" id="bkimp">Importar</button>
      <span class="sp"></span>
      <button class="btn primary" id="bkclose">Cerrar</button>
    </div>
  </div>
</div>

<script>
const KEY='calendario-examenes',TK='calendario-tema';
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const TIPOS={parcial:'Parcial',final:'Final',tp:'TP'};
let events=[];
try{events=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(events))events=[]}catch(e){events=[]}
events=events.filter(e=>e&&typeof e.date==='string'&&e.materia);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const cap=t=>TIPOS[t]||'Parcial';
const $=id=>document.getElementById(id);
const $$=s=>document.querySelectorAll(s);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const diff=s=>Math.round((parse(s)-parse(iso(new Date())))/864e5);
const cuando=n=>n===0?'Hoy':n===1?'Mañana':n>1?'En '+n+' días':n===-1?'Ayer':'Hace '+(-n)+' días';
const ord=(a,b)=>(a.date+(a.hora||'99')).localeCompare(b.date+(b.hora||'99'));
const pend=e=>!e.hecho&&diff(e.date)>=0;
let view=new Date();view.setDate(1);
let editing=null,filter='all',modo='mes',armed=false;

function render(){
  const y=view.getFullYear(),m=view.getMonth();
  const all=events.filter(e=>filter==='all'||e.type===filter);
  $('mes').textContent=MESES[m]+' '+y;
  const mes=all.filter(e=>{const d=parse(e.date);return d.getFullYear()===y&&d.getMonth()===m}).sort(ord);
  const cnt=k=>mes.filter(e=>e.type===k).length,p=cnt('parcial'),f=cnt('final'),tp=cnt('tp');
  $('resumen').textContent=mes.length?[p&&p+(p===1?' parcial':' parciales'),f&&f+(f===1?' final':' finales'),tp&&tp+(tp===1?' TP':' TPs')].filter(Boolean).join(', '):'Sin fechas este mes';

  const prox=events.filter(pend).sort(ord)[0],h=$('hero');
  if(prox){
    const n=diff(prox.date),nom=prox.type==='tp'?'TP':cap(prox.type).toLowerCase();
    const fe=parse(prox.date).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
    h.replaceChildren(el('div','big',n===0?'Hoy':String(n)),
      el('p',null,n===0?cap(prox.type)+' de '+prox.materia:(n===1?'día':'días')+' para el '+nom+' de '+prox.materia),
      el('small',null,fe+(prox.hora?', '+prox.hora+' h':'')));
  }else h.replaceChildren(el('div','big','0'),el('p',null,'Sin fechas pendientes'),el('small',null,'Anotá tu próximo parcial, final o TP.'));

  const cs=events.map(e=>parseFloat(String(e.calif||'').replace(',','.'))).filter(n=>!isNaN(n));
  const prom=cs.length?(cs.reduce((a,b)=>a+b,0)/cs.length).toLocaleString('es-AR',{maximumFractionDigits:1}):'-';
  const st=(v,l)=>{const d=el('div');d.append(el('b',null,String(v)),el('span',null,l));return d};
  $('stats').replaceChildren(st(events.filter(pend).length,'Pendientes'),st(events.filter(e=>e.hecho).length,'Hechos'),st(prom,'Promedio'));

  const g=$('grid');g.textContent='';
  DIAS.forEach(d=>g.appendChild(el('div','dow',d)));
  const off=(new Date(y,m,1).getDay()+6)%7;
  const total=Math.ceil((off+new Date(y,m+1,0).getDate())/7)*7,hoy=iso(new Date());
  for(let i=0;i<total;i++){
    const d=new Date(y,m,1-off+i),k=iso(d);
    const c=el('div','cell'+(d.getMonth()!==m?' out':'')+(k===hoy?' today':''));
    const num=el('button','num',d.getDate());
    num.setAttribute('aria-label','Anotar fecha el '+d.getDate()+' de '+MESES[d.getMonth()]);
    num.onclick=()=>openModal(null,k);
    c.appendChild(num);
    const ev=all.filter(e=>e.date===k).sort(ord);
    ev.forEach(e=>{
      const b=el('button','chip '+e.type+(e.hecho?' done':''),(e.hecho?'✓ ':'')+cap(e.type)+': '+e.materia);
      b.title=e.materia+(e.hora?', '+e.hora+' h':'')+(e.nota?' - '+e.nota:'');
      b.onclick=x=>{x.stopPropagation();openModal(e)};
      c.appendChild(b);
    });
    if(ev.length){const dots=el('div','dots');ev.forEach(e=>dots.appendChild(el('span','dot '+e.type)));c.appendChild(dots)}
    c.onclick=x=>{if(x.target===c)openModal(null,k)};
    g.appendChild(c);
  }

  const l=$('lista');l.textContent='';
  const rows=modo==='mes'?mes:all.filter(pend).sort(ord);
  if(!rows.length){l.appendChild(el('div','empty',modo==='mes'?'No hay fechas este mes. Tocá un día del calendario para anotar un parcial, un final o un TP.':'No tenés nada pendiente. Cuando anotes una fecha nueva, la vas a ver acá.'));}
  rows.forEach(e=>{
    const n=diff(e.date),d=parse(e.date);
    const r=el('div','row '+e.type+(e.hecho?' done':'')+(!e.hecho&&n>=0&&n<=3?' urg':''));
    const ck=el('button','chk',e.hecho?'✓':'');
    ck.setAttribute('aria-pressed',String(!!e.hecho));
    ck.setAttribute('aria-label','Marcar '+e.materia+' como hecho');
    ck.onclick=()=>{e.hecho=!e.hecho;save();render()};
    const mn=el('button','main');
    const dd=el('div','d',String(d.getDate()));
    dd.appendChild(el('span',null,DIAS[(d.getDay()+6)%7]+(modo==='mes'?'':' '+d.toLocaleDateString('es-AR',{month:'short'}).replace('.',''))));
    const mm=el('div','m');mm.appendChild(el('b',null,e.materia));
    mm.appendChild(el('span',null,[cuando(n),e.hora&&e.hora+' h',e.calif&&'Nota '+e.calif,e.nota].filter(Boolean).join(', ')));
    mn.append(dd,mm,el('span','tag '+e.type,cap(e.type)));
    mn.onclick=()=>openModal(e);
    r.append(ck,mn);l.appendChild(r);
  });
  $('mats').replaceChildren(...[...new Set(events.map(e=>e.materia))].sort().map(v=>{const o=el('option');o.value=v;return o}));
}

function openModal(e,date){
  editing=e;armed=false;
  $('mt').textContent=e?'Editar fecha':'Anotar fecha';
  $(e&&e.type==='final'?'t2':e&&e.type==='tp'?'t3':'t1').checked=true;
  $('materia').value=e?e.materia:'';
  $('fecha').value=e?e.date:(date||iso(new Date()));
  $('hora').value=e&&e.hora||'';
  $('nota').value=e&&e.nota||'';
  $('hecho').checked=!!(e&&e.hecho);
  $('calif').value=e&&e.calif||'';
  $('califw').hidden=!$('hecho').checked;
  $('del').hidden=!e;$('del').textContent='Eliminar';
  $('ov').classList.add('open');
  setTimeout(()=>$('materia').focus(),0);
}
const close=()=>$$('.overlay').forEach(o=>o.classList.remove('open'));
$('hecho').onchange=()=>{$('califw').hidden=!$('hecho').checked};
$('save').onclick=()=>{
  const materia=$('materia').value.trim(),fecha=$('fecha').value;
  if(!materia){$('materia').focus();return}
  if(!fecha){$('fecha').focus();return}
  const data={type:document.querySelector('input[name=tipo]:checked').value,materia,date:fecha,hora:$('hora').value,nota:$('nota').value.trim(),hecho:$('hecho').checked,calif:$('hecho').checked?$('calif').value.trim():''};
  if(editing)Object.assign(editing,data);
  else events.push(Object.assign({id:Date.now()+''+Math.floor(Math.random()*1e4)},data));
  save();close();
  const d=parse(fecha);view=new Date(d.getFullYear(),d.getMonth(),1);render();
};
$('del').onclick=()=>{
  if(!armed){armed=true;$('del').textContent='¿Seguro? Tocá de nuevo';return}
  events=events.filter(x=>x!==editing);save();close();render();
};
$('cancel').onclick=close;$('bkclose').onclick=close;
$$('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)close()});

$('resp').onclick=()=>{$('bk').value=JSON.stringify(events);$('bkmsg').textContent='';$('ov2').classList.add('open')};
$('bkcopy').onclick=async()=>{
  $('bk').select();
  try{await navigator.clipboard.writeText($('bk').value);$('bkmsg').textContent='Copiado.'}
  catch(e){$('bkmsg').textContent='Con el texto seleccionado, copialo a mano.'}
};
$('bkimp').onclick=()=>{
  try{
    const a=JSON.parse($('bk').value);if(!Array.isArray(a))throw 0;
    const ids=new Set(events.map(e=>e.id));let n=0;
    a.forEach(e=>{
      if(e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&TIPOS[e.type]&&e.materia&&!ids.has(e.id)){
        events.push({id:e.id||Date.now()+'i'+n,type:e.type,materia:String(e.materia).slice(0,60),date:e.date,hora:e.hora||'',nota:String(e.nota||'').slice(0,80),hecho:!!e.hecho,calif:String(e.calif||'').slice(0,5)});n++;
      }
    });
    save();render();$('bkmsg').textContent=n+(n===1?' fecha importada.':' fechas importadas.');
  }catch(x){$('bkmsg').textContent='Ese texto no es un respaldo válido.'}
};

$$('.fil').forEach(b=>b.onclick=()=>{filter=b.dataset.f;$$('.fil').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});
$$('.tab').forEach(b=>b.onclick=()=>{modo=b.dataset.m;$$('.tab').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});
const goto=(y,m)=>{view=new Date(y,m,1);render()};
$('prev').onclick=()=>goto(view.getFullYear(),view.getMonth()-1);
$('next').onclick=()=>goto(view.getFullYear(),view.getMonth()+1);
$('hoy').onclick=()=>{const t=new Date();goto(t.getFullYear(),t.getMonth())};
$('nuevo').onclick=()=>openModal(null,iso(new Date()));

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){close();return}
  const open=document.querySelector('.overlay.open');
  if(open){
    if(e.key==='Enter'&&open.id==='ov'&&e.target.tagName==='INPUT'&&e.target.type==='text')$('save').click();
    return;
  }
  if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowLeft')$('prev').click();
  else if(e.key==='ArrowRight')$('next').click();
  else if(e.key==='t'||e.key==='T')$('hoy').click();
  else if(e.key==='n'||e.key==='N'){e.preventDefault();$('nuevo').click()}
});

const root=document.documentElement;
try{const t=localStorage.getItem(TK);if(t)root.setAttribute('data-theme',t)}catch(e){}
$('tema').onclick=()=>{
  const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';root.setAttribute('data-theme',nx);
  try{localStorage.setItem(TK,nx)}catch(e){}
};
render();
</script>
</body>
</html>
