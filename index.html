<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Calendario</title>

  <!-- Canonical URL -->
  <link rel="canonical" href="https://luciano130605.github.io/calendar/">

  <!-- Theme color -->
  <meta name="theme-color" content="#0a0a0a">
  <meta name="theme-color" content="#f2f2f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">

  <!-- Favicon / iconos -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Referrer Policy -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Apple Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calendario">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Calendario">
  <meta property="og:description" content="Organizá parciales, finales y TPs en un calendario simple.">
  <meta property="og:url" content="https://luciano130605.github.io/calendar/">
  <meta property="og:image" content="https://luciano130605.github.io/calendar/og-image.png">

  <!-- Preload de recursos -->
  <link rel="preload" href="favicon.svg" as="image" type="image/svg+xml">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap">

</head>

<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-l" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6" />
      </symbol>
      <symbol id="i-r" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6" />
      </symbol>
      <symbol id="i-dl" viewBox="0 0 24 24">
        <path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
      </symbol>
      <symbol id="i-th" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6.5" height="6.5" rx="1.5" />
        <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" />
        <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" />
        <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" />
      </symbol>
      <symbol id="i-logo" viewBox="0 0 24 24">
        <path d="M3 12A9 9 0 0 1 12 3v9zM21 12a9 9 0 0 1-9 9v-9z" />
      </symbol>
    </defs>
  </svg>
  <div class="layout">
    <aside class="rail">
      <div class="brand"><svg class="ic">
          <use href="#i-logo" />
        </svg><span>Calendario</span></div>
      <div class="side">
        <div class="grp">Mostrar</div>
        <div class="fils">
          <button class="fil" data-f="all" aria-pressed="true"><i class="dot all"></i>Todo<em class="cn">0</em></button>
          <button class="fil" data-f="parcial" aria-pressed="false"><i class="dot parcial"></i>Parciales<em
              class="cn">0</em></button>
          <button class="fil" data-f="final" aria-pressed="false"><i class="dot final"></i>Finales<em
              class="cn">0</em></button>
          <button class="fil" data-f="tp" aria-pressed="false"><i class="dot tp"></i>TPs<em class="cn">0</em></button>
        </div>
        <div class="grp">Datos</div>
        <button class="nv" id="resp"><svg class="ic">
            <use href="#i-dl" />
          </svg>Respaldo</button>
        <button class="nv" id="tema"><svg class="ic">
            <use href="#i-th" />
          </svg>Cambiar tema</button>
        <p class="hint"><kbd>←</kbd><kbd>→</kbd>cambiar mes<br><kbd>T</kbd>ir a hoy<br><kbd>N</kbd>anotar fecha</p>
      </div>
    </aside>
    <main class="wrap">
      <div class="crumb"><svg class="ic">
          <use href="#i-grid" />
        </svg><span>Calendario</span></div>
      <div class="top">
        <div>
          <h1 id="mes">Mes</h1>
          <div class="sub" id="resumen"></div>
        </div>
        <div class="nav">
          <button class="btn sq" id="prev" aria-label="Mes anterior"><svg class="ic">
              <use href="#i-l" />
            </svg></button>
          <button class="btn" id="hoy">Hoy</button>
          <button class="btn sq" id="next" aria-label="Mes siguiente"><svg class="ic">
              <use href="#i-r" />
            </svg></button>
          <button class="btn primary" id="nuevo"><svg class="ic">
              <use href="#i-plus" />
            </svg>Anotar fecha</button>
        </div>
      </div>
      <div class="fils mfil" role="group" aria-label="Filtrar por tipo"><button class="fil" data-f="all"
          aria-pressed="true"><i class="dot all"></i>Todo<em class="cn">0</em></button><button class="fil"
          data-f="parcial" aria-pressed="false"><i class="dot parcial"></i>Parciales<em
            class="cn">0</em></button><button class="fil" data-f="final" aria-pressed="false"><i
            class="dot final"></i>Finales<em class="cn">0</em></button><button class="fil" data-f="tp"
          aria-pressed="false"><i class="dot tp"></i>TPs<em class="cn">0</em></button></div>
      <div class="cards">
        <section class="card hero" id="hero" aria-live="polite"></section>
        <section class="card avance">
          <div class="lbl">Avance</div>
          <div class="av"><b id="avn">0 / 0</b><span id="avl"></span></div>
          <div class="dotbar" id="dotbar" aria-hidden="true"></div>
          <div class="stats" id="stats"></div>
        </section>
      </div>
      <div class="cal">
        <div class="grid" id="grid"></div>
      </div>
      <section class="daypanel" id="daypanel" aria-live="polite"></section>
      <div class="tabs">
        <button class="tab" data-m="mes" aria-pressed="true">Este mes</button>
        <button class="tab" data-m="prox" aria-pressed="false">Próximas</button>
      </div>
      <div class="list" id="lista"></div>
    </main>
  </div>

  <div class="overlay" id="ov">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <h3 id="mt">Anotar fecha</h3>
      <div class="seg">
        <input type="radio" name="tipo" id="t1" value="parcial" checked><label class="parcial" for="t1">Parcial</label>
        <input type="radio" name="tipo" id="t2" value="final"><label class="final" for="t2">Final</label>
        <input type="radio" name="tipo" id="t3" value="tp"><label class="tp" for="t3">TP</label>
      </div>
      <label for="materia">Materia</label>
      <input type="text" id="materia" maxlength="60" list="mats" placeholder="Ej: Programación II" autocomplete="off">
      <datalist id="mats"></datalist>
      <div class="two">
        <div><label for="fecha">Fecha</label><input type="date" id="fecha"></div>
        <div><label for="hora">Hora (opcional)</label><input type="time" id="hora"></div>
      </div>
      <label for="nota">Nota (opcional)</label>
      <input type="text" id="nota" maxlength="80" placeholder="Aula, temas, si es grupal…">
      <label class="ck2"><input type="checkbox" id="hecho">Ya lo rendí o entregué</label>
      <div id="califw" hidden><label for="calif">Nota obtenida</label><input type="text" id="calif" maxlength="5"
          inputmode="decimal" placeholder="Ej: 8"></div>
      <div class="actions">
        <button class="btn danger" id="del" hidden>Eliminar</button>
        <span class="sp"></span>
        <button class="btn" id="cancel">Cancelar</button>
        <button class="btn primary" id="save">Guardar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="ov2">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bt">
      <h3 id="bt">Respaldo de tus fechas</h3>
      <p class="sub">Copiá este texto para guardarlo, o pegá uno de otro dispositivo y tocá Importar. Las fechas se
        suman, no se pisan.</p>
      <textarea id="bk" aria-label="Texto del respaldo"></textarea>
      <p id="bkmsg" aria-live="polite"></p>
      <div class="actions">
        <button class="btn" id="bkcopy">Copiar</button>
        <button class="btn" id="bkimp">Importar</button>
        <span class="sp"></span>
        <button class="btn primary" id="bkclose">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
